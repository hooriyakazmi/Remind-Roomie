
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remind Roomie - Tasks</title>
    <link rel="stylesheet" href="css/style.css?v=20261108-gray-3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <main class="container">

        <header class="page-header">
            <h1 class="page-title">Tasks</h1>
            <p>Review and respond to household task requests.</p>
        </header>

        <div id="taskListView">
            <section class="task-notifications">
                <div class="section-heading">
                    <h2>New Task Requested</h2>
                </div>
                <div id="taskRequests" aria-live="polite"></div>
            </section>

            <section class="task-history" id="yourTasksSection">
                <div class="section-heading">
                    <h2>Your Tasks</h2>
                </div>
                <div id="yourTasks" aria-live="polite"></div>
            </section>

            <section class="task-history">
                <div class="section-heading">
                    <h2>All Tasks</h2>
                    <button class="add-member-trigger" id="openAddTask" type="button" aria-expanded="false" aria-controls="addTaskForm">
                        <i class="fa-solid fa-plus" aria-hidden="true"></i>
                        Assign task
                    </button>
                </div>

                <form class="member-form" id="addTaskForm" hidden>
                    <h3>Assign a task</h3>
                    <label for="newTaskTitle">Task</label>
                    <input id="newTaskTitle" name="title" type="text" maxlength="100" placeholder="Enter a task" required>

                    <span class="task-form-label">Assign to</span>
                    <div class="task-assignee-options" id="taskAssigneeOptions"></div>

                    <div class="chore-datetime">
                        <label class="chore-input">
                            <i class="fa-regular fa-calendar" aria-hidden="true"></i>
                            <span class="visually-hidden">Due date</span>
                            <input id="newTaskDate" name="date" type="date">
                        </label>
                        <label class="chore-input">
                            <i class="fa-regular fa-clock" aria-hidden="true"></i>
                            <span class="visually-hidden">Due time</span>
                            <input id="newTaskTime" name="time" type="time">
                        </label>
                    </div>

                    <p class="family-message" id="newTaskMessage" role="alert" hidden></p>
                    <div class="member-form-actions">
                        <button class="secondary-button" id="cancelAddTask" type="button">Cancel</button>
                        <button class="primary-button" type="submit">Assign task</button>
                    </div>
                </form>

                <div id="allTasks" aria-live="polite"></div>
            </section>
        </div>

        <section class="task-feedback" id="taskFeedback" aria-live="polite" hidden>
            <div class="task-feedback-icon" id="taskFeedbackIcon" aria-hidden="true"></div>
            <h2 id="taskFeedbackTitle"></h2>
            <p id="taskFeedbackMessage"></p>
            <div id="feedbackTaskCard" class="feedback-task-slot"></div>
            <button class="task-action-button accept-task feedback-back-button" id="backToTasks" type="button">Back to Tasks</button>
        </section>

    </main>


    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

        <a href="index.html">
            <span><i class="fa-solid fa-house"></i></span>
            Home
        </a>

        <a href="calendar.html">
            <span><i class="fa-solid fa-calendar-days"></i></span>
            Calendar
        </a>

        <a href="tasks.html" class="active">
            <span><i class="fa-solid fa-list-check"></i></span>
            Tasks
        </a>

        <a href="family.html">
            <span><i class="fa-solid fa-users"></i></span>
            Family
        </a>

        <a href="settings.html">
            <span><i class="fa-solid fa-gear"></i></span>
            Settings
        </a>

    </nav>

    <script src="js/form-controls.js?v=20261108-gray-3"></script>
    <script src="js/data.js?v=20261108-gray-3"></script>
    <script src="js/script.js?v=20261108-gray-3"></script>

</body>
</html>
