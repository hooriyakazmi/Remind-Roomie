<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remind Roomie - Home</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <main class="home-container">

        <!-- Header -->
        <header class="header">
            <div class="profile-section">
                <div class="profile-avatar" id="profileAvatar"></div>

                <div class="welcome-text">
                    <p id="greeting"></p>
                    <h2 id="userName"></h2>
                </div>
            </div>

            <button class="notification-button" aria-label="Notifications">
                <i class="fa-regular fa-bell"></i>
            </button>
        </header>


        <!-- Today's Progress -->
        <section class="progress-card">

            <div class="progress-info">
                <p id="currentDate"></p>
                <h3>Today's Tasks</h3>
                <p id="taskProgress"></p>
            </div>

            <div class="progress-ring" id="progressRing">
                <div class="progress-inner">
                    <span id="progressPercentage"></span>
                </div>
            </div>

        </section>


        <!-- Quick Actions -->
        <section class="quick-actions">

            <a href="tasks.html" class="action-card">
                <div class="action-icon"><i class="fa-solid fa-plus"></i></div>
                <h3>Create New Task</h3>
                <p>Assign a household task</p>
            </a>

            <a href="family.html" class="action-card">
                <div class="action-icon"><i class="fa-solid fa-arrow-up-right-from-square"></i></div>
                <h3>My Circle</h3>
                <p>View your household</p>
            </a>

        </section>


        <!-- My Events -->
        <section class="events-section">

            <div class="events-header">
                <h3>My Events</h3>
                <span class="timeframe-label">This week</span>
            </div>

            <div id="homeEvents">
                <!-- Events are added using JavaScript -->
            </div>

        </section>

        <!-- My Tasks -->
        <section class="events-section">

            <div class="events-header">
                <h3>My tasks</h3>
                <span class="timeframe-label">This week</span>
            </div>

            <div id="homeTasks">
                <!-- Tasks are added using JavaScript -->
            </div>

        </section>

    </main>


    <div class="account-bar">
        <span>Signed in as <strong id="accountName"></strong></span>
        <button id="signOutButton" type="button">Sign out</button>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

        <a href="index.html" class="active">
            <span><i class="fa-solid fa-house"></i></span>
            Home
        </a>

        <a href="calendar.html">
            <span><i class="fa-solid fa-calendar-days"></i></span>
            Calendar
        </a>

        <a href="tasks.html">
            <span><i class="fa-solid fa-list-check"></i></span>
            Tasks
        </a>

        <a href="family.html">
            <span><i class="fa-solid fa-users"></i></span>
            Family
        </a>

        <a href="settings.html">
            <span><i class="fa-solid fa-gear"></i></span>
            Settings
        </a>

    </nav>


    <!-- JavaScript Files -->
    <script src="js/form-controls.js?v=20261108-names-1"></script>
    <script src="js/data.js?v=20261108-names-1"></script>
    <script src="js/script.js?v=20261108-names-1"></script>

</body>
</html>
