
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remind Roomie - Family</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <main class="container">

        <header class="page-header">
            <h1 class="page-title">My Family</h1>
            <p>Manage your household members.</p>
        </header>

        <section>
            <div class="section-heading">
                <h2>Household Members</h2>
                <button
                    class="add-member-trigger"
                    id="addMemberButton"
                    type="button"
                    aria-expanded="false"
                    aria-controls="memberForm"
                >
                    <i class="fa-solid fa-plus" aria-hidden="true"></i>
                    Invite member
                </button>
            </div>

            <form class="member-form" id="memberForm" hidden>
                <h3>Invite a roommate</h3>

                <label for="memberEmail">Email address</label>
                <input
                    id="memberEmail"
                    name="email"
                    type="email"
                    placeholder="roommate@example.com"
                    autocomplete="email"
                    required
                >

                <p class="form-help">The invitation is restricted to this email address. Share the household ID and one-time code with your roommate.</p>

                <div class="member-form-actions">
                    <button class="secondary-button" id="cancelAddMember" type="button">Cancel</button>
                    <button class="primary-button" type="submit">Create invitation</button>
                </div>
            </form>

            <p class="family-message" id="familyMessage" role="alert" hidden></p>

            <div id="familyList">
                <!-- Family members are added using JavaScript -->
            </div>
        </section>

    </main>

    <div class="account-bar">
        <span>Signed in as <strong id="accountName"></strong></span>
        <button id="signOutButton" type="button">Sign out</button>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

        <a href="index.html">
            <span><i class="fa-solid fa-house"></i></span>
            Home
        </a>

        <a href="calendar.html">
            <span><i class="fa-solid fa-calendar-days"></i></span>
            Calendar
        </a>

        <a href="tasks.html">
            <span><i class="fa-solid fa-list-check"></i></span>
            Tasks
        </a>

        <a href="family.html" class="active">
            <span><i class="fa-solid fa-users"></i></span>
            Family
        </a>

        <a href="settings.html">
            <span><i class="fa-solid fa-gear"></i></span>
            Settings
        </a>

    </nav>

    <script src="js/form-controls.js?v=20261108-names-1"></script>
    <script src="js/data.js?v=20261108-names-1"></script>
    <script src="js/script.js?v=20261108-names-1"></script>

</body>
</html>
